services:
  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

  api:
    build: .
    image: banking-agent:latest
    command: >
      python -m uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/src
      BANKING_DB_PATH: /app/data/banking.db
      CHECKPOINT_PATH: /app/data/langgraph_checkpoints.db
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: banking-api
      OTEL_ENVIRONMENT: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ./data:/app/data
    depends_on:
      - jaeger
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  mcp:
    image: banking-agent:latest
    build: .
    command: python -m mcp_server
    ports:
      - "8001:8001"
    environment:
      PYTHONPATH: /app/src
      BANKING_DB_PATH: /app/data/banking.db
      CHECKPOINT_PATH: /app/data/langgraph_checkpoints.db
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: banking-mcp
      OTEL_ENVIRONMENT: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ui:
    image: banking-agent:latest
    build: .
    command: >
      python -m streamlit run /app/src/ui/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app/src
      API_BASE_URL: http://api:8000
      MCP_BASE_URL: http://mcp:8001
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: banking-ui
      OTEL_ENVIRONMENT: docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      api:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped
